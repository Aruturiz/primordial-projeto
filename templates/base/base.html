<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Primordial{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00bf63',
                        dark: '#1a1a1a',
                        light: '#dedede',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f0f0f0; }
        .sidebar { background-color: #1a1a1a; }
        .nav-link:hover { background-color: #00bf63; color: #1a1a1a !important; }
        .nav-link:hover i { color: #1a1a1a !important; }
        .nav-link.active { background-color: #00bf63; color: #1a1a1a !important; }
        .nav-link.active i { color: #1a1a1a !important; }
    </style>
</head>
<body>

<div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="sidebar w-64 text-white flex flex-col flex-shrink-0">
        <!-- Logo -->
        <div class="p-6 border-b border-gray-700">
            <h1 class="text-2xl font-bold" style="color:#00bf63">⚡ Primordial</h1>
            <p class="text-xs mt-1" style="color:#dedede">Marketing Agency</p>
        </div>

        <!-- Menu -->
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
            <a href="/dashboard/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition text-gray-300">
                <i class="fas fa-chart-line" style="color:#00bf63"></i> Dashboard
            </a>
            <a href="/crm/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition text-gray-300">
                <i class="fas fa-users" style="color:#00bf63"></i> CRM
            </a>
            <a href="/projetos/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition text-gray-300">
                <i class="fas fa-folder" style="color:#00bf63"></i> Projetos
            </a>
            <a href="/conteudo/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition text-gray-300">
                <i class="fas fa-calendar" style="color:#00bf63"></i> Conteúdo
            </a>
            <a href="/metricas/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition text-gray-300">
                <i class="fas fa-chart-bar" style="color:#00bf63"></i> Métricas
            </a>
            <a href="/financeiro/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition text-gray-300">
                <i class="fas fa-dollar-sign" style="color:#00bf63"></i> Financeiro
            </a>
            <a href="/estrategia/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition text-gray-300">
                <i class="fas fa-brain" style="color:#00bf63"></i> Estratégia
            </a>
            <a href="/estrategia/30em1/" class="nav-link flex items-center gap-3 px-4 py-3 rounded-lg transition text-gray-300">
                <i class="fas fa-calendar-check" style="color:#00bf63"></i> 30 em 1
            </a
        </nav>

        <!-- User -->
        <div class="p-4 border-t border-gray-700">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-sm" style="background-color:#00bf63; color:#1a1a1a">
                    {{ request.user.username|first|upper }}
                </div>
                <div>
                    <p class="text-sm font-medium text-white">{{ request.user.username }}</p>
                    <a href="/admin/logout/" class="text-xs hover:text-white" style="color:#dedede">Sair</a>
                </div>
            </div>
        </div>
    </aside>

    <!-- Conteúdo principal -->
    <main class="flex-1 overflow-auto">
        <!-- Header -->
        <header class="bg-white shadow-sm px-8 py-4 flex items-center justify-between sticky top-0 z-10">
            <h2 class="text-xl font-semibold" style="color:#1a1a1a">{% block page_title %}{% endblock %}</h2>
            <span class="text-sm" style="color:#dedede">{% now "d/m/Y" %}</span>
        </header>

        <!-- Página -->
        <div class="p-8">
            {% block content %}{% endblock %}
        </div>
    </main>
</div>

<script>
    // Marca o link ativo no menu
    const links = document.querySelectorAll('.nav-link');
    links.forEach(link => {
        if (window.location.pathname.startsWith(new URL(link.href).pathname)) {
            link.classList.add('active');
        }
    });
</script>

</body>
</html>
