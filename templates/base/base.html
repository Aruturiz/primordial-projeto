<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Primordial{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white flex flex-col">
            <!-- Logo -->
            <div class="p-6 border-b border-gray-700">
                <h1 class="text-2xl font-bold text-yellow-400">⚡ Primordial</h1>
                <p class="text-gray-400 text-sm">Marketing Agency</p>
            </div>

            <!-- Menu -->
            <nav class="flex-1 p-4 space-y-1">
                <a href="/dashboard/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
                    <i class="fas fa-chart-line text-yellow-400"></i> Dashboard
                </a>
                <a href="/crm/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
                    <i class="fas fa-users text-yellow-400"></i> CRM
                </a>
                <a href="/projetos/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
                    <i class="fas fa-folder text-yellow-400"></i> Projetos
                </a>
                <a href="/conteudo/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
                    <i class="fas fa-calendar text-yellow-400"></i> Conteúdo
                </a>
                <a href="/metricas/" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-gray-700 transition">
                    <i class="fas fa-chart-bar text-yellow-400"></i> Métricas
                </a>
            </nav>

            <!-- User -->
            <div class="p-4 border-t border-gray-700">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-yellow-400 rounded-full flex items-center justify-center text-gray-900 font-bold">
                        {{ request.user.username|first|upper }}
                    </div>
                    <div>
                        <p class="text-sm font-medium">{{ request.user.username }}</p>
                        <a href="/admin/logout/" class="text-xs text-gray-400 hover:text-white">Sair</a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Conteúdo principal -->
        <main class="flex-1 overflow-auto">
            <!-- Header -->
            <header class="bg-white shadow-sm px-8 py-4 flex items-center justify-between">
                <h2 class="text-xl font-semibold text-gray-800">{% block page_title %}{% endblock %}</h2>
                <span class="text-sm text-gray-500">{% now "d/m/Y" %}</span>
            </header>

            <!-- Página -->
            <div class="p-8">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

</body>
</html>
