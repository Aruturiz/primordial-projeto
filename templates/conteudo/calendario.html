{% extends 'base/base.html' %}
{% block title %}Calendário - Primordial{% endblock %}
{% block page_title %}Calendário Editorial{% endblock %}

{% block content %}

<div class="bg-white rounded-xl shadow p-6">
    <div class="flex items-center justify-between mb-6">
        <div class="flex gap-4 flex-wrap">
            <span class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-pink-500 inline-block"></span> Instagram</span>
            <span class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span> Facebook</span>
            <span class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-blue-800 inline-block"></span> LinkedIn</span>
            <span class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-gray-900 inline-block"></span> TikTok</span>
            <span class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-red-600 inline-block"></span> YouTube</span>
            <span class="flex items-center gap-2 text-sm"><span class="w-3 h-3 rounded-full bg-yellow-400 inline-block"></span> Outros</span>
        </div>
        <a href="{% url 'novo_conteudo' %}" class="bg-yellow-400 text-gray-900 font-bold px-5 py-2 rounded-lg hover:bg-yellow-500 transition">
            + Novo Conteúdo
        </a>
    </div>

    <div id="calendar"></div>
</div>

<link href="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/fullcalendar.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/3.10.2/locale/pt-br.js"></script>

<script>
    $(document).ready(function() {
        $('#calendar').fullCalendar({
            locale: 'pt-br',
            header: {
                left: 'prev,next today',
                center: 'title',
                right: 'month,agendaWeek,agendaDay'
            },
            events: {{ eventos_json|safe }},
            eventClick: function(event) {
                if (event.url) {
                    window.location.href = event.url;
                    return false;
                }
            },
            height: 650,
            buttonText: {
                today: 'Hoje',
                month: 'Mês',
                week: 'Semana',
                day: 'Dia'
            }
        });
    });
</script>

{% endblock %}
