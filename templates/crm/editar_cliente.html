{% extends 'base/base.html' %}
{% block title %}Editar Cliente - Primordial{% endblock %}
{% block page_title %}Editar — {{ cliente.nome }}{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto bg-white rounded-xl shadow p-8">
    <form method="post">
        {% csrf_token %}

        <!-- Dados Básicos -->
        <div class="mb-8">
            <h3 class="text-lg font-semibold mb-4 pb-2 border-b" style="color:#1a1a1a; border-color:#dedede">
                <i class="fas fa-user mr-2" style="color:#00bf63"></i>Dados Básicos
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Nome *</label>
                    <input type="text" name="nome" value="{{ cliente.nome }}" required
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Empresa</label>
                    <input type="text" name="empresa" value="{{ cliente.empresa }}"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Email *</label>
                    <input type="email" name="email" value="{{ cliente.email }}" required
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Telefone</label>
                    <input type="text" name="telefone" value="{{ cliente.telefone }}"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Status</label>
                    <select name="status" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                        <option value="lead" {% if cliente.status == 'lead' %}selected{% endif %}>Lead</option>
                        <option value="prospecto" {% if cliente.status == 'prospecto' %}selected{% endif %}>Prospecto</option>
                        <option value="ativo" {% if cliente.status == 'ativo' %}selected{% endif %}>Ativo</option>
                        <option value="inativo" {% if cliente.status == 'inativo' %}selected{% endif %}>Inativo</option>
                        <option value="clientes_ouro" {% if cliente.status == 'clietes_ouro' %}selected{% endif %}>Cliente Ouro</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Segmento</label>
                    <select name="segmento" class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                        <option value="">Selecione...</option>
                        <option value="moda" {% if cliente.segmento == 'moda' %}selected{% endif %}>Moda e Beleza</option>
                        <option value="saude" {% if cliente.segmento == 'saude' %}selected{% endif %}>Saúde e Bem-estar</option>
                        <option value="alimentacao" {% if cliente.segmento == 'alimentacao' %}selected{% endif %}>Alimentação</option>
                        <option value="tecnologia" {% if cliente.segmento == 'tecnologia' %}selected{% endif %}>Tecnologia</option>
                        <option value="educacao" {% if cliente.segmento == 'educacao' %}selected{% endif %}>Educação</option>
                        <option value="imobiliario" {% if cliente.segmento == 'imobiliario' %}selected{% endif %}>Imobiliário</option>
                        <option value="varejo" {% if cliente.segmento == 'varejo' %}selected{% endif %}>Varejo</option>
                        <option value="servicos" {% if cliente.segmento == 'servicos' %}selected{% endif %}>Serviços</option>
                        <option value="outro" {% if cliente.segmento == 'outro' %}selected{% endif %}>Outro</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Dados Pessoais -->
        <div class="mb-8">
            <h3 class="text-lg font-semibold mb-4 pb-2 border-b" style="color:#1a1a1a; border-color:#dedede">
                <i class="fas fa-id-card mr-2" style="color:#00bf63"></i>Dados Pessoais
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">CPF/CNPJ</label>
                    <input type="text" name="cpf_cnpj" value="{{ cliente.cpf_cnpj }}"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Data de Nascimento</label>
                    <input type="date" name="data_nascimento" value="{{ cliente.data_nascimento|date:'Y-m-d' }}"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Endereço</label>
                    <input type="text" name="endereco" value="{{ cliente.endereco }}"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Cidade</label>
                    <input type="text" name="cidade" value="{{ cliente.cidade }}"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Estado</label>
                    <input type="text" name="estado" value="{{ cliente.estado }}" maxlength="2" placeholder="Ex: SP"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
            </div>
        </div>

        <!-- Redes Sociais -->
        <div class="mb-8">
            <h3 class="text-lg font-semibold mb-4 pb-2 border-b" style="color:#1a1a1a; border-color:#dedede">
                <i class="fas fa-share-alt mr-2" style="color:#00bf63"></i>Redes Sociais
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Instagram</label>
                    <input type="text" name="instagram" value="{{ cliente.instagram }}" placeholder="@usuario"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Facebook</label>
                    <input type="text" name="facebook" value="{{ cliente.facebook }}"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">LinkedIn</label>
                    <input type="text" name="linkedin" value="{{ cliente.linkedin }}"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">TikTok</label>
                    <input type="text" name="tiktok" value="{{ cliente.tiktok }}" placeholder="@usuario"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Site</label>
                    <input type="url" name="site" value="{{ cliente.site }}" placeholder="https://"
                        class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">
                </div>
            </div>
        </div>

        <!-- Observações -->
        <div class="mb-8">
            <label class="block text-sm font-medium mb-2" style="color:#1a1a1a">Observações</label>
            <textarea name="observacoes" rows="3"
                class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2" style="border-color:#dedede">{{ cliente.observacoes }}</textarea>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="font-bold px-6 py-3 rounded-lg transition" style="background-color:#00bf63; color:#1a1a1a">
                <i class="fas fa-save mr-2"></i>Salvar Alterações
            </button>
            <a href="{% url 'detalhe_cliente' cliente.pk %}" class="font-medium px-6 py-3 rounded-lg transition" style="background-color:#dedede; color:#1a1a1a">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
