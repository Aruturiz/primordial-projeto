{% extends 'base/base.html' %}
{% block title %}Nova Estratégia - Primordial{% endblock %}
{% block page_title %}Nova Estratégia{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto bg-white rounded-xl shadow p-8">
    <div class="flex items-center gap-3 mb-6">
        <div class="w-12 h-12 bg-yellow-100 rounded-full flex items-center justify-center">
            <i class="fas fa-robot text-yellow-500 text-xl"></i>
        </div>
        <div>
            <h3 class="font-semibold text-gray-800">Primo — IA Estrategista</h3>
            <p class="text-sm text-gray-500">Especialista em marketing digital da Primordial</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Título da Estratégia *</label>
                <input type="text" name="titulo" required placeholder="Ex: Estratégia Instagram Q2 2026"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Tipo *</label>
                <select name="tipo" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="">Selecione...</option>
                    <option value="redes_sociais">Redes Sociais</option>
                    <option value="conteudo">Conteúdo</option>
                    <option value="marketing_completo">Marketing Completo</option>
                    <option value="roteiro">Roteiro</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Cliente</label>
                <select name="cliente"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="">Nenhum</option>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.pk }}">{{ cliente.nome }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <button type="submit" class="w-full bg-yellow-400 text-gray-900 font-bold px-6 py-3 rounded-lg hover:bg-yellow-500 transition">
            <i class="fas fa-robot mr-2"></i>Iniciar Conversa com a IA
        </button>
    </form>
</div>

{% endblock %}
