{% extends 'base/base.html' %}
{% block title %}Editar Projeto - Primordial{% endblock %}
{% block page_title %}Editar Projeto{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto bg-white rounded-xl shadow p-8">
    <form method="post">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-2">Nome do Projeto *</label>
                <input type="text" name="nome" value="{{ projeto.nome }}" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Cliente</label>
                <select name="cliente"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="">Nenhum</option>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.pk }}" {% if projeto.cliente.pk == cliente.pk %}selected{% endif %}>
                        {{ cliente.nome }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Responsável</label>
                <select name="responsavel"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="">Nenhum</option>
                    {% for user in responsaveis %}
                    <option value="{{ user.pk }}" {% if projeto.responsavel.pk == user.pk %}selected{% endif %}>
                        {{ user.username }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                <select name="status"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    <option value="planejamento" {% if projeto.status == 'planejamento' %}selected{% endif %}>Planejamento</option>
                    <option value="em_andamento" {% if projeto.status == 'em_andamento' %}selected{% endif %}>Em Andamento</option>
                    <option value="pausado" {% if projeto.status == 'pausado' %}selected{% endif %}>Pausado</option>
                    <option value="concluido" {% if projeto.status == 'concluido' %}selected{% endif %}>Concluído</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Data de Início *</label>
                <input type="date" name="data_inicio" value="{{ projeto.data_inicio|date:'Y-m-d' }}" required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Data Prazo</label>
                <input type="date" name="data_prazo" value="{{ projeto.data_prazo|date:'Y-m-d' }}"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Descrição</label>
            <textarea name="descricao" rows="3"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-400">{{ projeto.descricao }}</textarea>
        </div>

        <div class="flex gap-3">
            <button type="submit" class="bg-yellow-400 text-gray-900 font-bold px-6 py-3 rounded-lg hover:bg-yellow-500 transition">
                Salvar Alterações
            </button>
            <a href="{% url 'detalhe_projeto' projeto.pk %}" class="bg-gray-100 text-gray-700 font-medium px-6 py-3 rounded-lg hover:bg-gray-200 transition">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
